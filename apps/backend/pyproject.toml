[project]
name = "backend"
version = "0.1.0"
description = "WealthOS backend API"
readme = "README.md"
authors = [
    { name = "Guna"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
