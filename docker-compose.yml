services:
  postgres:
    image: postgres:18
    container_name: wealthos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: wealthos
      POSTGRES_DB: wealthos
    ports:
      - "5432:5432"
    volumes:
      - wealthos-postgres-data:/var/lib/postgresql

volumes:
  wealthos-postgres-data: